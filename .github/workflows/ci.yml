name: CI

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  tests:
    name: Python tests (PostgreSQL + S3)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: covid_db
          POSTGRES_USER: covid_user
          POSTGRES_PASSWORD: ci_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U covid_user -d covid_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PG_HOST: 127.0.0.1
      PG_PORT: 5432
      PG_DATABASE: covid_db
      PG_USER: covid_user
      PG_PASSWORD: ci_postgres_password
      S3_ENDPOINT_URL: http://127.0.0.1:9000
      S3_ACCESS_KEY: covid_admin
      S3_SECRET_KEY: ci_silo_password
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Start S3-compatible storage (SILO)
        run: |
          docker run -d --name covid-minio \
            -p 9000:9000 \
            -p 9001:9001 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" \
            docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z \
            server /data --console-address ":9001"

      - name: Wait for SILO
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then
              echo "SILO is ready."
              exit 0
            fi
            sleep 2
          done
          docker logs covid-minio
          exit 1

      - name: Run test suite
        run: python -m pytest -v
